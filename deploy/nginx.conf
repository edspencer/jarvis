# JARVIS in a container: the built viewer (dist/) at /usr/share/nginx/html, and a site folder (site.json, the model,
# the data files) at /usr/share/nginx/html/site, served at the same URLs as the app, as `npm run dev` does. A request
# is answered from the app first, then from the site folder. The image ships the demo house as its site; mount your
# own folder over it.
#
# This file is a template (the image puts it in /etc/nginx/templates/): at start-up the image fills in
# ${JARVIS_PLUGIN_ORIGINS}, the origins external plugins may load from besides the viewer's own (space-separated,
# e.g. "https://plugins.example.org"; empty by default). Used directly, put your list (or nothing) in its place.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # revalidate every time, so a new model or build shows on reload (ETags keep it cheap)
    add_header Cache-Control "no-cache" always;
    # a building's floor plan, its equipment and its device list: keep it out of search engines
    add_header X-Robots-Tag "noindex, nofollow" always;
    # scripts only from here (and the plugin origins you allow), whatever a site manifest says or a redirect points to:
    # the browser's own enforcement of the plugin trust rules (docs/plugins.md; tools/csp.ts is the same policy, and
    # says why 'unsafe-eval': three's Basis (KTX2) transcoder compiles with new Function in a blob: worker)
    add_header Content-Security-Policy "script-src 'self' 'unsafe-eval' ${JARVIS_PLUGIN_ORIGINS}; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" always;
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ @site;
    }
    location @site {
        root /usr/share/nginx/html/site;
        try_files $uri =404;
    }

    # a types block here replaces nginx's whole map, so restate it, then add what it lacks (wasm is in it: the Basis
    # transcoder's streaming compile needs application/wasm)
    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
        model/gltf+json gltf;
        image/ktx2 ktx2;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # JSON (parts files, device maps) gzips 4-8x; compressed glbs barely shrink, but it doesn't hurt
    gzip_types text/css text/javascript application/javascript application/json application/wasm model/gltf-binary
        model/gltf+json image/svg+xml;
}
