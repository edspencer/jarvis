version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # one PR a week for the tooling; the runtime dependencies (three.js and friends) one by one, as they can change
      # what the viewer draws
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # TypeScript waits for typescript-eslint to support the next major; @types/node follows the Node line we target
    # (22 LTS, .nvmrc). Both move by hand.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # the build stage stays on the Node LTS line we target (22, .nvmrc); nginx and the rest update as usual
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: docker
