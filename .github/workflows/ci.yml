name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (with coverage)
        run: npm run test:coverage
      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`;
            console.log(["### Unit test coverage", "", "| | % | covered |", "| --- | --: | --: |",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always() && hashFiles('coverage/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - name: Build
        run: npm run build
      - name: Validate the demo site
        run: npm run validate-site -- examples/demo-site
      # examples/demo-site is generated by tools/make-demo-site.ts: the committed copy must be what the script writes
      - name: Demo site is up to date
        run: |
          npm run demo-site
          git add -N examples/demo-site
          if ! git diff --exit-code --stat examples/demo-site; then
            echo "::error::examples/demo-site differs from what tools/make-demo-site.ts writes: run npm run demo-site and commit the result"
            exit 1
          fi

  e2e:
    name: E2E (Playwright, demo site, software WebGL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # No GPU on hosted runners: WebGL runs in SwiftShader (E2E_GPU=0 makes that explicit). The demo house is small
      # enough that the whole suite takes about a minute even so.
      - name: Browser E2E against examples/demo-site
        id: e2e
        env:
          E2E_GPU: '0'
        run: npm run test:e2e
      - name: Upload Playwright report and traces
        if: failure() && steps.e2e.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: error

  image:
    name: Container image (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: jarvis:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
      # The image serves the viewer and its baked-in demo site; then the same with a site folder mounted over it.
      - name: Smoke test
        run: |
          set -euo pipefail
          check() { # url, expected content type
            local h
            h="$(curl -fsS -D - -o /dev/null "$1")"
            echo "$1: $(echo "$h" | grep -i '^content-type' | tr -d '\r')"
            echo "$h" | grep -qi "^content-type: $2" || { echo "::error::$1: expected $2"; echo "$h"; exit 1; }
            echo "$h" | grep -qi '^x-robots-tag: noindex' || { echo "::error::$1: no X-Robots-Tag"; exit 1; }
            echo "$h" | grep -qi '^cache-control: no-cache' || { echo "::error::$1: no Cache-Control"; exit 1; }
          }
          wait_up() { for _ in $(seq 1 30); do curl -fsS -o /dev/null "http://127.0.0.1:$1/" && return 0; sleep 1; done; return 1; }

          docker run -d --name demo -p 8080:80 jarvis:ci
          wait_up 8080
          check http://127.0.0.1:8080/ text/html
          check http://127.0.0.1:8080/site.json application/json
          check http://127.0.0.1:8080/demo.glb model/gltf-binary
          check http://127.0.0.1:8080/blueprints/A-1.png image/png
          check "http://127.0.0.1:8080/assets/$(basename "$(docker exec demo sh -c 'ls /usr/share/nginx/html/assets/*.wasm')")" application/wasm
          curl -fsS http://127.0.0.1:8080/robots.txt | grep -q 'Disallow: /'
          curl -fsS -H 'Accept-Encoding: gzip' -D - -o /dev/null http://127.0.0.1:8080/ha_devices.json | grep -qi '^content-encoding: gzip'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nope.json)" = 404

          mkdir -p "$RUNNER_TEMP/my-site"
          cp -r examples/demo-site/. "$RUNNER_TEMP/my-site/"
          sed -i 's/"name": "Demo house"/"name": "Mounted site"/' "$RUNNER_TEMP/my-site/site.json"
          docker run -d --name mounted -p 8081:80 -v "$RUNNER_TEMP/my-site:/usr/share/nginx/html/site:ro" jarvis:ci
          wait_up 8081
          curl -fsS http://127.0.0.1:8081/site.json | grep -q '"Mounted site"'
          check http://127.0.0.1:8081/demo.glb model/gltf-binary
      - name: Container logs
        if: failure()
        run: docker logs demo || true; docker logs mounted || true
